services:
  # ---------------------------------------------------------
  # 1. Managed Redis Service (BullMQ Message Broker)
  # ---------------------------------------------------------
  - type: redis
    name: simple-converter-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: [] # Internal network access only

  # ---------------------------------------------------------
  # 2. Web Service (Express API & WebSockets)
  # ---------------------------------------------------------
  - type: web
    name: simple-converter-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_REGION
        value: eu-central-1
      - key: REDIS_URL
        fromService:
          type: redis
          name: simple-converter-redis
          property: connectionString
      - key: REDIS_CLUSTER_ENABLED
        value: "false"

  # ---------------------------------------------------------
  # 3. Background Worker (BullMQ + FFmpeg Conversion Engine)
  # ---------------------------------------------------------
  - type: worker
    name: simple-converter-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET_NAME
        sync: false
      - key: AWS_REGION
        value: eu-central-1
      - key: REDIS_URL
        fromService:
          type: redis
          name: simple-converter-redis
          property: connectionString
      - key: REDIS_CLUSTER_ENABLED
        value: "false"
      - key: WORKER_CONCURRENCY
        value: "2"
